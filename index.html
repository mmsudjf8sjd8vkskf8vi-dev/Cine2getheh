<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e0f14">
<title>Cine con amigos</title>
<style>
:root{--bg:#0e0f14;--s1:#171922;--s2:#222532;--tx:#f3f4f6;--mu:#9aa0b4;--a1:#8b5cf6;--ac:linear-gradient(135deg,#8b5cf6,#ec4899);--bd:rgba(255,255,255,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.mu{color:var(--mu)}
.s{display:none;height:100dvh;flex-direction:column;padding:16px;gap:12px;overflow-y:auto;background:radial-gradient(800px 380px at 50% -120px,rgba(139,92,246,.25),transparent)}
.s.on{display:flex}
h1{margin:0;font-size:26px;text-align:center}
h2{margin:0;font-size:22px}
h3{margin:0;font-size:16px}
p{margin:0}
input,button{font:inherit;border:0;outline:0}
input{background:var(--s2);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;width:100%;min-width:0}
input:focus{border-color:var(--a1)}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:#8b5cf6;flex:none}
button{border-radius:12px;padding:12px 16px;font-weight:600;color:#fff;background:var(--ac);cursor:pointer}
button:active{transform:scale(.97)}
button.g{background:var(--s2);color:var(--tx);border:1px solid var(--bd)}
button.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center}
.bar{display:flex;align-items:center;gap:8px;justify-content:space-between}
.logo{width:76px;height:76px;border-radius:24px;background:var(--ac);display:grid;place-items:center;font-size:38px;margin:0 auto;box-shadow:0 10px 30px rgba(139,92,246,.4)}
.lbl{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:14px}
.it{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--bd);padding:8px;border-radius:14px;margin-bottom:8px;cursor:pointer}
.it.on{border-color:var(--a1);background:linear-gradient(90deg,rgba(139,92,246,.22),var(--s1))}
.it img{width:96px;height:54px;border-radius:8px;object-fit:cover;background:#000;flex:none}
.t{flex:1;min-width:0;font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ico{width:44px;height:44px;border-radius:12px;background:var(--ac);display:grid;place-items:center;font-size:20px;flex:none}
.empty{color:var(--mu);text-align:center;padding:24px 8px}
#room{padding:0;gap:8px;overflow:hidden}
#top{padding:10px 12px 0}
#room .row{padding:0 12px}
#vid{aspect-ratio:16/9;background:#000;width:100%;flex:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#vid iframe{width:100%;height:100%}
.tabs{display:flex;gap:4px;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:4px;margin:0 12px}
.tabs button{flex:1;background:transparent;color:var(--mu);padding:9px 4px;font-size:14px;border-radius:10px}
.tabs button.on{background:var(--ac);color:#fff}
#pan{display:flex;flex:1;min-height:0;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#pan::-webkit-scrollbar{display:none}
.pn{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;padding:4px 12px 12px;display:flex;flex-direction:column;min-height:0}
#chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 0}
.m{max-width:85%;background:var(--s2);padding:8px 12px;border-radius:14px 14px 14px 4px;word-break:break-word;align-self:flex-start}
.m.me{align-self:flex-end;background:var(--ac);border-radius:14px 14px 4px 14px}
.m b{display:block;font-size:12px;opacity:.75}
.m .acts{display:flex;gap:6px;margin-top:6px}
.p{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--bd);padding:10px;border-radius:14px;margin-bottom:8px}
.p i{width:36px;height:36px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-style:normal;font-weight:700;flex:none}
#cnt{color:var(--mu);margin:2px 2px 8px}
#hid{position:fixed;left:-300px;top:0;width:10px;height:10px;overflow:hidden}
#toast{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--bd);box-shadow:0 8px 30px rgba(0,0,0,.5);padding:10px 18px;border-radius:24px;z-index:9;max-width:90%;text-align:center}
</style></head><body>

<div id="auth" class="s" style="justify-content:center">
  <div class="logo">🎬</div>
  <h1>Cine con amigos</h1>
  <p class="mu" style="text-align:center">Cargando… la primera vez puede tardar un poco.</p>
</div>

<div id="rooms" class="s">
  <div class="bar"><h2>Mis Salas</h2><button class="g sm" id="me" onclick="rename()"></button></div>
  <div id="rl"></div>
  <div class="card">
    <h3>✨ Crear sala</h3>
    <input id="rname" placeholder="Nombre de la sala">
    <label class="lbl"><input type="checkbox" id="rpriv" checked> Privada (pide clave)</label>
    <input id="rpass" placeholder="Clave de la sala">
    <button onclick="create()">Crear sala</button>
  </div>
  <div class="card">
    <h3>🔑 Entrar con código</h3>
    <div class="row"><input id="jid" placeholder="Código"><input id="jpass" placeholder="Clave (si es privada)"></div>
    <button class="g" onclick="enter($('jid').value.trim().toUpperCase(),$('jpass').value)">Entrar</button>
  </div>
</div>

<div id="room" class="s">
  <div id="top" class="bar">
    <div class="row" style="padding:0;min-width:0">
      <button class="g" onclick="back()">←</button>
      <b id="rn" style="font-size:17px"></b>
    </div>
    <button class="g sm" onclick="copyCode()">📋 <span id="rc"></span></button>
  </div>
  <div id="vid"><div id="pl"></div></div>
  <div class="row"><input id="lk" placeholder="Pega un enlace de video o lista de YouTube"><button onclick="addLink()">Añadir</button></div>
  <div class="tabs">
    <button class="on" onclick="tab(0)">👥 Personas</button>
    <button onclick="tab(1)">💬 Chat</button>
    <button onclick="tab(2)">🎞 Lista</button>
  </div>
  <div id="pan">
    <div class="pn" id="pp"></div>
    <div class="pn"><div id="chat"></div><div class="row" style="padding:6px 0 0"><input id="cm" placeholder="Escribe un mensaje"><button onclick="send()">➤</button></div></div>
    <div class="pn"><div id="cnt"></div><div id="ql"></div></div>
  </div>
</div>

<div id="hid"></div><div id="toast"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const $=i=>document.getElementById(i);
let S,Q=[],cur=-1,P,ready=false,app=false,want=null,cr=null,inRoom=false;
const ID=/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/;

function show(x){['auth','rooms','room'].forEach(i=>$(i).classList.toggle('on',i===x));inRoom=x==='room'}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2800)}
function tab(i){$('pan').scrollTo({left:i*$('pan').clientWidth,behavior:'smooth'})}
$('pan').addEventListener('scroll',()=>{
  const i=Math.round($('pan').scrollLeft/$('pan').clientWidth);
  document.querySelectorAll('.tabs button').forEach((b,j)=>b.classList.toggle('on',j===i));
});
function copyCode(){
  const c=$('rc').textContent;
  if(navigator.clipboard)navigator.clipboard.writeText(c).then(()=>toast('Código copiado: '+c)).catch(()=>toast('Código: '+c));
  else toast('Código: '+c);
}

// ---------- Entrada directa (invitado) ----------
async function guest(){
  try{
    const r=await fetch('/api/guest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({n:localStorage.n||''})});
    const j=await r.json();
    if(j.e)return toast(j.e);
    localStorage.t=j.t;localStorage.n=j.n;conn();
  }catch(e){toast('No pude conectar. Reintentando…');setTimeout(guest,3000)}
}
function rename(){
  const v=prompt('Tu nombre:',localStorage.n||'');
  if(v===null)return;
  S.emit('name',v,a=>{if(a&&a.n){localStorage.n=a.n;$('me').textContent='✏️ '+a.n}else toast('Nombre no válido')});
}

// ---------- Conexión ----------
function conn(){
  if(S)S.disconnect();
  S=io({auth:{t:localStorage.t}});
  S.on('connect_error',e=>{if(e.message==='auth'){S.disconnect();localStorage.removeItem('t');guest()}});
  S.on('connect',()=>{$('me').textContent='✏️ '+localStorage.n;cr&&inRoom?enter(cr.id,cr.pass,1):loadRooms()});
  S.on('ppl',l=>{
    const el=$('pp');el.innerHTML='';
    l.forEach(x=>{
      const d=document.createElement('div');d.className='p';
      const a=document.createElement('i');a.textContent=x.n[0].toUpperCase();
      const n=document.createElement('span');n.textContent=x.n+(x.o?' ♛':'');
      d.append(a,n);el.appendChild(d);
    });
  });
  S.on('chat',addChat);
  S.on('q',d=>{Q=d.q;cur=d.cur;rl()});
  S.on('go',d=>{cur=d.cur;rl();const x=Q[cur];if(x)load(x.id,0,true)});
  S.on('st',d=>{
    if(!ready)return;app=true;
    P.seekTo(d.t,true);d.playing?P.playVideo():P.pauseVideo();
    setTimeout(()=>app=false,1500);
  });
  S.on('gone',()=>{toast('La sala fue eliminada');cr=null;loadRooms()});
}

// ---------- Mis Salas ----------
function loadRooms(){
  show('rooms');
  S.emit('my',l=>{
    const el=$('rl');el.innerHTML='';
    if(!l.length)el.innerHTML='<div class="empty">Aún no tienes salas.<br>Crea una abajo 👇</div>';
    l.forEach(r=>{
      const d=document.createElement('div');d.className='it';
      const ic=document.createElement('div');ic.className='ico';ic.textContent=r.priv?'🔒':'🎬';
      const inf=document.createElement('div');inf.style.cssText='flex:1;min-width:0';
      const b=document.createElement('div');b.className='t';b.textContent=r.name;
      const sm=document.createElement('small');sm.className='mu';sm.textContent='Código '+r.id+' · '+r.n+' conectados';
      inf.append(b,sm);d.append(ic,inf);
      if(r.own){
        const k=document.createElement('button');k.className='g sm';k.textContent='🗑';
        k.onclick=e=>{e.stopPropagation();if(confirm('¿Eliminar la sala "'+r.name+'"?')){S.emit('del',r.id);setTimeout(loadRooms,300)}};
        d.appendChild(k);
      }
      d.onclick=()=>enter(r.id,'');
      el.appendChild(d);
    });
  });
}
function create(){
  const priv=$('rpriv').checked,pass=$('rpass').value;
  S.emit('create',{name:$('rname').value.trim(),priv,pass},a=>{if(a.e)return toast(a.e);enter(a.id,pass)});
}
function enter(id,pass,re){
  S.emit('join',{id,pass},a=>{
    if(a.e){toast(a.e);if(re)loadRooms();return}
    cr={id,pass};Q=a.q;cur=a.cur;show('room');
    $('rn').textContent=a.name;$('rc').textContent=a.id;
    if(!re)$('chat').innerHTML='';
    rl();
    if(!re&&cur>=0&&Q[cur])load(Q[cur].id,a.st.t,a.st.playing);
  });
}
function back(){S.emit('out');cr=null;if(ready){app=true;P.stopVideo();setTimeout(()=>app=false,1000)}loadRooms()}

// ---------- Reproductor ----------
window.onYouTubeIframeAPIReady=()=>{
  P=new YT.Player('pl',{width:'100%',height:'100%',playerVars:{playsinline:1,rel:0},
    events:{onReady:()=>{ready=true;if(want)apply()},onStateChange:sc}});
};
function load(id,t,pl){want={id,t,pl};if(ready)apply()}
function apply(){const w=want;app=true;w.pl?P.loadVideoById(w.id,w.t):P.cueVideoById(w.id,w.t);setTimeout(()=>app=false,1500)}
function sc(e){
  const s=e.data;
  if(s===1&&cur>=0&&Q[cur]&&!Q[cur].t){const t=P.getVideoData().title;if(t)S.emit('ti',{i:cur,t})}
  if(app)return;
  if(s===1||s===2)S.emit('st',{playing:s===1,t:P.getCurrentTime()});
  else if(s===0)S.emit('next',cur);
}

// ---------- Lista ----------
function rl(){
  const el=$('ql');el.innerHTML='';
  if(!Q.length)el.innerHTML='<div class="empty">La lista está vacía.<br>Pega un enlace arriba 👆</div>';
  Q.forEach((x,i)=>{
    const d=document.createElement('div');d.className='it'+(i===cur?' on':'');
    const im=new Image();im.loading='lazy';im.src='https://i.ytimg.com/vi/'+encodeURIComponent(x.id)+'/mqdefault.jpg';
    const b=document.createElement('div');b.className='t';b.textContent=(i===cur?'▶ ':'')+(x.t||('Video '+(i+1)));
    const k=document.createElement('button');k.className='g sm';k.textContent='✕';
    k.onclick=e=>{e.stopPropagation();S.emit('rm',i)};
    d.append(im,b,k);d.onclick=()=>S.emit('play',i);el.appendChild(d);
  });
  $('cnt').textContent=Q.length+' videos en la lista';
}
function addLink(){
  const v=$('lk').value.trim();if(!v)return;$('lk').value='';
  const l=v.match(/[?&]list=([\w-]+)/),i=v.match(ID);
  if(l)imp(l[1]);else if(i)S.emit('add',[{id:i[1],t:''}]);else toast('Enlace no válido');
}
async function imp(list){
  toast('Importando lista…');
  try{
    const r=await fetch('/api/playlist?list='+encodeURIComponent(list),{headers:{'x-t':localStorage.t}});
    const j=await r.json();
    if(j.e)return toast(j.e);
    if(!j.nokey){
      if(!j.items.length)return toast('La lista está vacía');
      S.emit('add',j.items);
      return toast(j.items.length+' videos añadidos');
    }
  }catch(e){}
  impViejo(list);
}
function impViejo(list){
  const d=document.createElement('div');$('hid').appendChild(d);
  new YT.Player(d,{width:'10',height:'10',playerVars:{listType:'playlist',list},events:{onReady:e=>{
    let n=0;
    const iv=setInterval(()=>{
      const a=e.target.getPlaylist();
      if((a&&a.length)||++n>20){
        clearInterval(iv);e.target.destroy();
        if(a&&a.length){S.emit('add',a.map(id=>({id,t:''})));toast(a.length+' videos añadidos (máximo 200 sin clave de YouTube)')}
        else toast('No pude leer la lista (¿es privada?)');
      }
    },500);
  }}});
}

// ---------- Chat ----------
function addChat(d){
  const e=document.createElement('div');
  e.className='m'+(d.n===localStorage.n?' me':'');
  const b=document.createElement('b');b.textContent=d.n;
  e.append(b,document.createTextNode(d.m));
  const m=d.m.match(ID);
  if(m){
    const a=document.createElement('div');a.className='acts';
    [['▶ Reproducir',1],['＋ Añadir',0]].forEach(([t,p])=>{
      const k=document.createElement('button');k.className='g sm';k.textContent=t;
      k.onclick=()=>S.emit('add',[{id:m[1],t:''}],p);a.appendChild(k);
    });
    e.appendChild(a);
  }
  const c=$('chat');c.appendChild(e);c.scrollTop=c.scrollHeight;
}
function send(){const v=$('cm').value.trim();if(v){S.emit('chat',v);$('cm').value=''}}
$('cm').onkeydown=e=>{if(e.key==='Enter')send()};
$('lk').onkeydown=e=>{if(e.key==='Enter')addLink()};

if(localStorage.t)conn();else guest();
</script></body></html>
