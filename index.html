<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cine con amigos</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#1b1d24;color:#eee;font:15px system-ui,sans-serif}
.s{display:none;height:100dvh;flex-direction:column;padding:12px;gap:10px;overflow-y:auto}
.s.on{display:flex}
input,button{font:inherit;padding:10px;border-radius:8px;border:0}
input{background:#2a2d38;color:#eee;width:100%;min-width:0}
button{background:#f5b301;color:#000;font-weight:600;cursor:pointer}
button.g{background:#2a2d38;color:#eee}
button.sm{padding:3px 8px;font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.it{display:flex;align-items:center;gap:8px;background:#2a2d38;padding:8px;border-radius:8px;margin-bottom:6px;cursor:pointer}
.it.on{outline:2px solid #f5b301}
.it img{width:80px;height:45px;object-fit:cover;border-radius:4px}
.it b,.it span{flex:1;font-weight:400;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
h2,h3{margin:6px 0}
#room{padding:0;gap:6px;overflow:hidden}
#top,#room .row,.tabs{padding:0 12px}
#vid{aspect-ratio:16/9;background:#000;width:100%;flex:none}
#vid iframe{width:100%;height:100%}
.tabs{display:flex;gap:6px}.tabs button{flex:1}
#pan{display:flex;flex:1;min-height:0;overflow-x:auto;scroll-snap-type:x mandatory}
.pn{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;padding:4px 12px;display:flex;flex-direction:column;min-height:0}
#chat{flex:1;overflow-y:auto}.m{margin-bottom:6px;word-break:break-word}
.p{background:#2a2d38;padding:10px;border-radius:8px;margin-bottom:6px}
#hid{position:fixed;left:-300px;top:0;width:10px;height:10px;overflow:hidden}
#toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;padding:10px 16px;border-radius:20px;z-index:9;max-width:90%}
</style></head><body>

<div id="auth" class="s">
  <h2>🎬 Cine con amigos</h2>
  <input id="u" placeholder="Usuario" autocapitalize="none">
  <input id="p" type="password" placeholder="Clave">
  <button onclick="doAuth('login')">Iniciar sesión</button>
  <button class="g" onclick="doAuth('register')">Crear cuenta</button>
  <div id="gbtn" style="margin-top:6px"></div>
</div>

<div id="rooms" class="s">
  <div class="row"><h2 style="flex:1">Mis Salas</h2><span id="me"></span><button class="g" onclick="logout()">Salir</button></div>
  <div id="rl"></div>
  <h3>Crear sala</h3>
  <input id="rname" placeholder="Nombre de la sala">
  <label><input type="checkbox" id="rpriv" checked style="width:auto"> Privada (pide clave)</label>
  <input id="rpass" placeholder="Clave de la sala">
  <button onclick="create()">Crear sala</button>
  <h3>Entrar con código</h3>
  <div class="row"><input id="jid" placeholder="Código"><input id="jpass" placeholder="Clave (si es privada)"></div>
  <button class="g" onclick="enter($('jid').value.trim().toUpperCase(),$('jpass').value)">Entrar</button>
</div>

<div id="room" class="s">
  <div id="top" class="row" style="padding-top:8px">
    <button class="g" onclick="back()">←</button>
    <div><b id="rn"></b><br><small>Código: <span id="rc"></span></small></div>
  </div>
  <div id="vid"><div id="pl"></div></div>
  <div class="row"><input id="lk" placeholder="Pega un enlace de video o lista de YouTube"><button onclick="addLink()">Añadir</button></div>
  <div class="tabs">
    <button class="g" onclick="tab(0)">👥 Personas</button>
    <button class="g" onclick="tab(1)">💬 Chat</button>
    <button class="g" onclick="tab(2)">🎞 Lista</button>
  </div>
  <div id="pan">
    <div class="pn" id="pp"></div>
    <div class="pn"><div id="chat"></div><div class="row" style="padding:6px 0"><input id="cm" placeholder="Mensaje"><button onclick="send()">➤</button></div></div>
    <div class="pn"><small id="cnt"></small><div id="ql"></div></div>
  </div>
</div>

<div id="hid"></div><div id="toast"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="/socket.io/socket.io.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const $=i=>document.getElementById(i);
let S,Q=[],cur=-1,P,ready=false,app=false,want=null,cr=null,inRoom=false;
const ID=/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/;

function show(x){['auth','rooms','room'].forEach(i=>$(i).classList.toggle('on',i===x));inRoom=x==='room'}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2800)}
function tab(i){$('pan').scrollTo({left:i*$('pan').clientWidth,behavior:'smooth'})}

// ---------- Cuenta ----------
async function doAuth(kind){
  const r=await fetch('/api/'+kind,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({u:$('u').value.trim(),p:$('p').value})});
  const j=await r.json();
  if(j.e)return toast(j.e);
  localStorage.t=j.t;localStorage.n=j.n;conn();
}
function logout(){localStorage.clear();if(S)S.disconnect();cr=null;show('auth')}

// ---------- Conexión ----------
function conn(){
  if(S)S.disconnect();
  S=io({auth:{t:localStorage.t}});
  S.on('connect_error',e=>{if(e.message==='auth'){localStorage.removeItem('t');show('auth')}});
  S.on('connect',()=>{$('me').textContent='👤 '+localStorage.n;cr&&inRoom?enter(cr.id,cr.pass,1):loadRooms()});
  S.on('ppl',l=>{const el=$('pp');el.innerHTML='';l.forEach(x=>{const d=document.createElement('div');d.className='p';d.textContent=(x.o?'♛ ':'👤 ')+x.n;el.appendChild(d)})});
  S.on('chat',addChat);
  S.on('q',d=>{Q=d.q;cur=d.cur;rl()});
  S.on('go',d=>{cur=d.cur;rl();const x=Q[cur];if(x)load(x.id,0,true)});
  S.on('st',d=>{
    if(!ready)return;app=true;
    P.seekTo(d.t,true);d.playing?P.playVideo():P.pauseVideo();
    setTimeout(()=>app=false,1500);
  });
  S.on('gone',()=>{toast('La sala fue eliminada');cr=null;loadRooms()});
}

// ---------- Mis Salas ----------
function loadRooms(){
  show('rooms');
  S.emit('my',l=>{
    const el=$('rl');el.innerHTML='';
    if(!l.length)el.innerHTML='<small>Aún no tienes salas. Crea una abajo.</small>';
    l.forEach(r=>{
      const d=document.createElement('div');d.className='it';
      const sp=document.createElement('span');
      sp.textContent=(r.priv?'🔒 ':'')+r.name+' · '+r.id+' · 👤'+r.n;
      d.appendChild(sp);
      if(r.own){const b=document.createElement('button');b.className='g sm';b.textContent='🗑';
        b.onclick=e=>{e.stopPropagation();if(confirm('¿Eliminar la sala "'+r.name+'"?')){S.emit('del',r.id);setTimeout(loadRooms,300)}};d.appendChild(b)}
      d.onclick=()=>enter(r.id,'');
      el.appendChild(d);
    });
  });
}
function create(){
  const priv=$('rpriv').checked,pass=$('rpass').value;
  S.emit('create',{name:$('rname').value.trim(),priv,pass},a=>{if(a.e)return toast(a.e);enter(a.id,pass)});
}
function enter(id,pass,re){
  S.emit('join',{id,pass},a=>{
    if(a.e){toast(a.e);if(re)loadRooms();return}
    cr={id,pass};Q=a.q;cur=a.cur;show('room');
    $('rn').textContent=a.name;$('rc').textContent=a.id;
    if(!re)$('chat').innerHTML='';
    rl();
    if(!re&&cur>=0&&Q[cur])load(Q[cur].id,a.st.t,a.st.playing);
  });
}
function back(){S.emit('out');cr=null;if(ready){app=true;P.stopVideo();setTimeout(()=>app=false,1000)}loadRooms()}

// ---------- Reproductor ----------
window.onYouTubeIframeAPIReady=()=>{
  P=new YT.Player('pl',{width:'100%',height:'100%',playerVars:{playsinline:1,rel:0},
    events:{onReady:()=>{ready=true;if(want)apply()},onStateChange:sc}});
};
function load(id,t,pl){want={id,t,pl};if(ready)apply()}
function apply(){const w=want;app=true;w.pl?P.loadVideoById(w.id,w.t):P.cueVideoById(w.id,w.t);setTimeout(()=>app=false,1500)}
function sc(e){
  const s=e.data;
  if(s===1&&cur>=0&&Q[cur]&&!Q[cur].t){const t=P.getVideoData().title;if(t)S.emit('ti',{i:cur,t})}
  if(app)return;
  if(s===1||s===2)S.emit('st',{playing:s===1,t:P.getCurrentTime()});
  else if(s===0)S.emit('next',cur);
}

// ---------- Lista ----------
function rl(){
  const el=$('ql');el.innerHTML='';
  Q.forEach((x,i)=>{
    const d=document.createElement('div');d.className='it'+(i===cur?' on':'');
    const im=new Image();im.loading='lazy';im.src='https://i.ytimg.com/vi/'+encodeURIComponent(x.id)+'/mqdefault.jpg';
    const b=document.createElement('b');b.textContent=x.t||('Video '+(i+1));
    const k=document.createElement('button');k.className='g sm';k.textContent='✕';
    k.onclick=e=>{e.stopPropagation();S.emit('rm',i)};
    d.append(im,b,k);d.onclick=()=>S.emit('play',i);el.appendChild(d);
  });
  $('cnt').textContent=Q.length+' videos en la lista';
}
function addLink(){
  const v=$('lk').value.trim();if(!v)return;$('lk').value='';
  const l=v.match(/[?&]list=([\w-]+)/),i=v.match(ID);
  if(l)imp(l[1]);else if(i)S.emit('add',[{id:i[1],t:''}]);else toast('Enlace no válido');
}
function imp(list){
  toast('Importando lista…');
  const d=document.createElement('div');$('hid').appendChild(d);
  new YT.Player(d,{width:'10',height:'10',playerVars:{listType:'playlist',list},events:{onReady:e=>{
    let n=0;
    const iv=setInterval(()=>{
      const a=e.target.getPlaylist();
      if((a&&a.length)||++n>20){
        clearInterval(iv);e.target.destroy();
        if(a&&a.length){S.emit('add',a.map(id=>({id,t:''})));toast(a.length+' videos añadidos')}
        else toast('No pude leer la lista (¿es privada?)');
      }
    },500);
  }}});
}

// ---------- Chat ----------
function addChat(d){
  const e=document.createElement('div');e.className='m';
  const b=document.createElement('b');b.textContent=d.n+': ';e.append(b,d.m);
  const m=d.m.match(ID);
  if(m)[['▶ Reproducir',1],['＋ Añadir',0]].forEach(([t,p])=>{
    const k=document.createElement('button');k.className='g sm';k.textContent=t;
    k.onclick=()=>S.emit('add',[{id:m[1],t:''}],p);e.append(' ',k);
  });
  const c=$('chat');c.appendChild(e);c.scrollTop=c.scrollHeight;
}
function send(){const v=$('cm').value.trim();if(v){S.emit('chat',v);$('cm').value=''}}
$('cm').onkeydown=e=>{if(e.key==='Enter')send()};
$('lk').onkeydown=e=>{if(e.key==='Enter')addLink()};

// ---------- Google ----------
async function gInit(){
  try{
    const c=(await (await fetch('/api/cfg')).json()).g;
    if(!c)return;
    const t=setInterval(()=>{if(window.google&&google.accounts){clearInterval(t);
      google.accounts.id.initialize({client_id:c,callback:async r=>{
        const x=await fetch('/api/google',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({c:r.credential})});
        const j=await x.json();if(j.e)return toast(j.e);
        localStorage.t=j.t;localStorage.n=j.n;conn();}});
      google.accounts.id.renderButton($('gbtn'),{theme:'filled_black',size:'large',text:'continue_with',width:260});
    }},300);
  }catch(e){}
}
gInit();

if(localStorage.t)conn();else show('auth');
</script></body></html>
