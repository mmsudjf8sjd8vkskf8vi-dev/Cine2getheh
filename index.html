<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cine con amigos</title>
<style>
  body{margin:0;background:#111827;color:#e5e7eb;font-family:sans-serif}
  .caja{padding:16px;max-width:600px;margin:auto}
  input,button{font-size:16px;padding:12px;border-radius:8px;border:0;margin:4px 0;box-sizing:border-box}
  input{background:#1f2937;color:#fff;width:100%}
  button{background:#fbbf24;color:#000;font-weight:bold}
  #player{width:100%;aspect-ratio:16/9;background:#000}
  .fila{display:flex;gap:6px}
  .fila input{flex:1}
  #usuarios span{display:inline-block;background:#166534;padding:6px 10px;border-radius:6px;margin:3px}
  #chat{height:180px;overflow:auto;background:#1f2937;border-radius:8px;padding:8px;margin:6px 0}
</style>
</head>
<body>
<div class="caja" id="inicio">
  <h1>🎬 Cine con amigos</h1>
  <input id="nombre" placeholder="Tu nombre">
  <input id="codigo" placeholder="Código de sala (vacío = sala nueva)">
  <button onclick="entrar()">Entrar</button>
</div>

<div id="sala" hidden>
  <div id="player"></div>
  <div class="caja">
    <div class="fila">
      <input id="enlace" placeholder="Pega un enlace de YouTube">
      <button onclick="cargar()">▶</button>
    </div>
    <p>Sala: <b id="nombreSala"></b> — <a href="#" id="copiar" style="color:#fbbf24">copiar enlace</a></p>
    <div id="usuarios"></div>
    <div id="chat"></div>
    <div class="fila">
      <input id="msg" placeholder="Escribe un mensaje">
      <button onclick="enviar()">Enviar</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const socket = io();
let yt, listo = false, ignorar = false, pendiente = null;

const params = new URLSearchParams(location.search);
if (params.get('sala')) document.getElementById('codigo').value = params.get('sala');

function entrar() {
  const nombre = document.getElementById('nombre').value.trim() || 'Invitado';
  let codigo = document.getElementById('codigo').value.trim() || Math.random().toString(36).slice(2, 8);
  history.replaceState(null, '', '?sala=' + codigo);
  document.getElementById('inicio').hidden = true;
  document.getElementById('sala').hidden = false;
  document.getElementById('nombreSala').textContent = codigo;
  socket.emit('entrar', { sala: codigo, nombre });
}

document.getElementById('copiar').onclick = (e) => {
  e.preventDefault();
  navigator.clipboard.writeText(location.href);
  e.target.textContent = '¡copiado!';
};

function onYouTubeIframeAPIReady() {
  yt = new YT.Player('player', {
    width: '100%', height: '100%',
    playerVars: { playsinline: 1 },
    events: {
      onReady: () => { listo = true; if (pendiente) aplicar(pendiente); },
      onStateChange: (e) => {
        if (ignorar) return;
        if (e.data === 1) socket.emit('control', { play: true, t: yt.getCurrentTime() });
        if (e.data === 2) socket.emit('control', { play: false, t: yt.getCurrentTime() });
      }
    }
  });
}

function idDeYoutube(url) {
  const m = url.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
  return m ? m[1] : null;
}

function cargar() {
  const id = idDeYoutube(document.getElementById('enlace').value);
  if (!id) return alert('Enlace de YouTube no válido');
  socket.emit('cargar', id);
  document.getElementById('enlace').value = '';
}

function aplicar(e) {
  if (!listo) { pendiente = e; return; }
  if (!e.id) return;
  ignorar = true;
  const actual = yt.getVideoData && yt.getVideoData().video_id;
  if (actual !== e.id) {
    yt.loadVideoById(e.id, e.t);
    if (!e.play) setTimeout(() => yt.pauseVideo(), 500);
  } else {
    if (Math.abs(yt.getCurrentTime() - e.t) > 1.5) yt.seekTo(e.t, true);
    e.play ? yt.playVideo() : yt.pauseVideo();
  }
  setTimeout(() => ignorar = false, 1000);
}

socket.on('estado', aplicar);

socket.on('usuarios', (lista) => {
  document.getElementById('usuarios').innerHTML = lista.map(n => `<span>${n.replace(/</g,'&lt;')}</span>`).join('');
});

function enviar() {
  const i = document.getElementById('msg');
  if (i.value.trim()) socket.emit('chat', i.value);
  i.value = '';
}

socket.on('chat', ({ nombre, texto }) => {
  const c = document.getElementById('chat');
  const p = document.createElement('div');
  p.textContent = nombre + ': ' + texto;
  c.appendChild(p);
  c.scrollTop = c.scrollHeight;
});
</script>
</body>
</html>
